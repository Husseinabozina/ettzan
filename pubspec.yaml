name: etzan_life_coaching
description: A responsive Arabic/English life coaching Flutter application.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  equatable: ^2.1.0
  easy_localization: ^3.0.8
  flutter_bloc: ^9.1.1
  flutter_svg: 2.2.3
  get_it: ^9.2.1
  google_fonts: 6.3.1
  image_picker: ^1.1.2
  supabase_flutter: ^2.15.4
  webview_flutter: ^4.14.1

dev_dependencies:
  build_runner: 2.4.15
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/icon/etzan_app_icon_1024.png"
  adaptive_icon_background: "#FDFDFE"
  adaptive_icon_foreground: "assets/branding/icon/etzan_adaptive_foreground.png"
  web:
    generate: true
    image_path: "assets/branding/icon/etzan_app_icon_1024.png"
  macos:
    generate: true
    image_path: "assets/branding/icon/etzan_app_icon_1024.png"

flutter_native_splash:
  color: "#F6F1FF"
  image: "assets/branding/etzan_logo.png"
  android_12:
    color: "#F6F1FF"
    image: "assets/branding/icon/etzan_adaptive_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/branding/
    - assets/illustrations/
    - assets/icons/
