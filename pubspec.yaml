name: etzan_life_coaching
description: A responsive Arabic/English life coaching Flutter application.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  equatable: ^2.1.0
  easy_localization: ^3.0.8
  flutter_bloc: ^9.1.1
  flutter_svg: 2.2.3
  get_it: ^9.2.1
  google_fonts: 6.3.1
  supabase_flutter: ^2.15.4
  webview_flutter: ^4.14.1

dev_dependencies:
  build_runner: 2.4.15
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/branding/
    - assets/illustrations/
    - assets/icons/
